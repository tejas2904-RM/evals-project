[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalpilot"
version = "0.3.0"
description = "Evals for teams shipping LLM features: binary graders, judge calibration and a release gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalpilot = "evalpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q -m 'not live'"
markers = ["live: makes a real paid API call; run with EVALPILOT_LIVE=1 pytest -m live"]
