[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalpilot"
version = "0.10.0"
description = "Evals and AI system audits for teams shipping LLM features: binary graders, OWASP probes, code scan, risk register."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7", "fpdf2>=2.7", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
audit = ["bandit>=1.7"]
pdf = ["fpdf2>=2.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
evalpilot = "evalpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evalpilot.audit" = ["rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q -m 'not live'"
markers = ["live: makes a real paid API call; run with EVALPILOT_LIVE=1 pytest -m live"]
