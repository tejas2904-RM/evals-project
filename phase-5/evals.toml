[project]
name = "evalpilot"
budget_usd = 3.00
default_provider = "offline"

[models]
bot_env = "EVALPILOT_BOT_MODEL"
judge_env = "EVALPILOT_JUDGE_MODEL"
max_completion_tokens = 400
# Lowest reasoning effort GPT-5.4 nano/mini accept (supported: none, low, medium, high, xhigh).
reasoning_effort = "none"

# USD per 1M tokens, standard tier, from https://developers.openai.com/api/docs/pricing
# Paid calls are refused for any model without a non-zero price here.
[pricing."gpt-5.4-nano"]
input = 0.20
cached_input = 0.02
output = 1.25

[pricing."gpt-5.4-mini"]
input = 0.75
cached_input = 0.075
output = 4.50

[bot]
top_k = 4

[retry]
max_attempts = 5
base_delay_s = 1.0
max_delay_s = 30.0

[providers.openai]
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
paid = true

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
paid = false

[providers.ollama]
base_url_env = "OLLAMA_BASE_URL"
base_url = "http://localhost:11434/v1"
paid = false

[providers.offline]
paid = false
fixtures = ["data/offline_responses.jsonl", "data/offline_reviews.jsonl"]

[paths]
data_dir = "data"
runs_dir = "runs"
cache_dir = ".cache"

# Full AI system audit (Docs/Audit.md). Target code is never executed.
[audit]
max_probes = 60
probe_rate_per_s = 2           # used when the adapter doesn't set its own rate
request_timeout_s = 20
require_authorization = true   # URL probing needs --authorized
ai_review = true               # gpt-5.4-mini over the riskiest files; offline uses fixtures
ai_review_max_files = 15
ai_review_max_input_tokens = 60000
ai_review_max_completion_tokens = 1500
max_repo_mb = 50
max_files = 5000
max_file_kb = 1024
gitleaks_bin = "gitleaks"      # built-in regex secret rules when not on PATH

[audit.severity]               # severity = likelihood x impact (1-5 each)
critical = 20
high = 12
medium = 6

[audit.verdict]
block_on_critical = true
max_open_high = 0
ai_only_max_level = "medium"   # uncorroborated AI-review risks can't block; see calibration.json ai_review precision

# Judge calibration against human labels (Docs/Evals.md section 5). Positive class = pass.
[calibration]
min_labels = 60                # judge labels in total
min_per_judge = 30
min_per_code_grader = 10       # sanity check only; code graders are not gated

[calibration.targets]
tpr = 0.85
tnr = 0.85
kappa = 0.60
